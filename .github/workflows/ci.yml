name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        run: |
          cd api
          npm ci

      - name: Run backend audit
        run: |
          cd api
          npm audit --audit-level=high || true

      - name: Run backend tests
        run: |
          cd api
          npm test

      - name: Run backend smoke (health)
        env:
          JWT_SECRET: test_secret
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          cd api
          node src/index.js &
          sleep 2
          node scripts/smoke.js

      - name: Setup Node for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps and build
        run: |
          cd frontend
          npm ci
          npm run build
